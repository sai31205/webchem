<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChem - Chemistry Learning Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 { font-size: 3em; margin-bottom: 20px; }
        .emoji { font-size: 4em; margin-bottom: 20px; }
        p { font-size: 1.2em; margin-bottom: 30px; opacity: 0.9; }
        .status {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            margin: 10px 0;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .feature {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .api-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .api-link:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🧪</div>
        <h1>WebChem</h1>
        <p>Complete Chemistry Learning Platform</p>

        <div class="status" id="status">
            🔄 Checking backend status...
        </div>

        <div class="features">
            <div class="feature">
                <div style="font-size: 2em;">🔐</div>
                <div>Authentication</div>
            </div>
            <div class="feature">
                <div style="font-size: 2em;">📚</div>
                <div>Lessons</div>
            </div>
            <div class="feature">
                <div style="font-size: 2em;">📊</div>
                <div>Progress</div>
            </div>
            <div class="feature">
                <div style="font-size: 2em;">⚗️</div>
                <div>Reactions</div>
            </div>
            <div class="feature">
                <div style="font-size: 2em;">🧮</div>
                <div>Calculators</div>
            </div>
            <div class="feature">
                <div style="font-size: 2em;">🏆</div>
                <div>Achievements</div>
            </div>
        </div>

        <a href="http://localhost:5000/api" class="api-link" target="_blank">
            View API Documentation
        </a>

        <p style="margin-top: 30px; font-size: 0.9em; opacity: 0.7;">
            Backend: <code>npm install && npm run dev</code>
        </p>
    </div>

    <script>
        // Check backend health
        fetch('http://localhost:5000/health')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerHTML = '✅ Backend is running!';
                document.getElementById('status').style.background = 'rgba(76, 175, 80, 0.3)';
            })
            .catch(err => {
                document.getElementById('status').innerHTML = '❌ Backend not running';
                document.getElementById('status').style.background = 'rgba(244, 67, 54, 0.3)';
            });
    </script>
</body>
</html>
